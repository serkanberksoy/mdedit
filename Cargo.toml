[package]
name = "mdedit"
version = "3.21.0"
edition = "2024"

[dependencies]
emojis = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
libtest-mimic = "0.8.2"
vt100 = "0.16.2"

[[test]]
name = "features"
harness = false

# `cargo run` and the tests are 15-20x faster with basic optimizations,
# which keeps a large note responsive in development builds too.
[profile.dev]
opt-level = 1
